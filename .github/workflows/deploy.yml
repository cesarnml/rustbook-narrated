name: Build and deploy narrated book

on:
  push:
    branches: [main]
  schedule:
    # Weekly, so upstream book/quiz updates show up here too — this repo
    # doesn't vendor the book's content, it clones it fresh every build.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (fetches the book, builds narrator, builds Astro site)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  test-exercises:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node (for the vocabulary gate)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build + test every exercise's solution binary
        run: |
          for dir in exercises/ch*/; do
            echo "::group::$dir"
            (cd "$dir" && cargo build --bin solution && cargo run --bin solution)
            echo "::endgroup::"
          done

      - name: Check exercises don't reach ahead of their chapter
        run: |
          npm install --omit=dev --no-save smol-toml
          node scripts/check-vocabulary.mjs
